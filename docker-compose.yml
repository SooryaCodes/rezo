services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rezo
      POSTGRES_USER: rezo
      POSTGRES_PASSWORD: rezo_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://rezo:rezo_dev@postgres:5432/rezo
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

  mock_shop:
    build: ./mock_shop
    ports: ["8001:8001"]

volumes:
  postgres_data:
