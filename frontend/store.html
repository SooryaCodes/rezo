<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders</title>
<link rel="stylesheet" href="/styles/app.css">
<style>
  .page { max-width: 720px; margin: 0 auto; padding: var(--s6) var(--s4) var(--s10); }
  .order { display: flex; gap: var(--s4); padding: var(--s4); align-items: flex-start; }
  .order + .order { border-top: 1px solid var(--border-subtle); }
  .cover { width: 68px; height: 68px; border-radius: var(--r-md); object-fit: cover;
           border: 1px solid var(--border-subtle); background: var(--surface-2); flex: none; }
  .track { display: flex; gap: var(--s2); align-items: center; font-size: var(--t-sm);
           color: var(--text-3); margin-top: 6px; }
  .trail { display: flex; align-items: center; gap: 4px; }
  .pip { width: 5px; height: 5px; border-radius: var(--r-full); background: var(--border-strong); }
  .pip.done { background: var(--success); }
  .pip.stuck { background: var(--warn); }
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <a class="brand" href="/"><span class="brand-mark">R</span></a>
    <span class="dim">/</span>
    <select class="select" id="storePicker" style="width:auto;min-width:180px"></select>
  </div>
  <div class="row">
    <select class="select" id="buyerPicker" style="width:auto;min-width:160px"></select>
    <button class="btn btn-ghost btn-sm" data-theme-toggle>Dark</button>
  </div>
</div>

<div class="page">
  <div style="margin-bottom:var(--s5)">
    <h1 id="storeName">Orders</h1>
    <p class="muted" id="storeSub">Your recent orders</p>
  </div>
  <div class="panel" id="orders">
    <div style="padding:var(--s5)"><div class="skeleton" style="width:60%"></div></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const storePicker = document.getElementById("storePicker");
const buyerPicker = document.getElementById("buyerPicker");
const ordersEl = document.getElementById("orders");
let allOrders = [];

(async function boot() {
  const stores = await API.stores();
  storePicker.innerHTML = stores.map((s) =>
    `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  allOrders = await API.orders();
  const buyers = [...new Map(allOrders.map((o) => [o.buyer_id, o.buyer_name])).entries()];
  buyerPicker.innerHTML = buyers.map(([id, name]) =>
    `<option value="${id}">${escapeHtml(name)}</option>`).join("");
  storePicker.onchange = buyerPicker.onchange = paint;
  paint();
})();

function paint() {
  const storeId = storePicker.value;
  const buyerId = buyerPicker.value;
  const store = storePicker.selectedOptions[0].textContent;
  document.getElementById("storeName").textContent = store;
  document.getElementById("storeSub").textContent =
    "Your orders, with dispute resolution built in";

  const rows = allOrders.filter((o) => o.store_id === storeId && o.buyer_id === buyerId);
  if (!rows.length) {
    ordersEl.innerHTML = `<div class="empty"><div class="empty-glyph">◻</div>
      <div class="strong">No orders here</div>
      <p class="small dim">This buyer hasn't ordered from this store. Pick another pairing above.</p></div>`;
    return;
  }

  ordersEl.innerHTML = rows.map((o) => {
    const item = o.items[0] || {};
    const stalled = !o.delivered_at && o.shipment_events?.length;
    const lastEvent = o.shipment_events?.[o.shipment_events.length - 1];
    const idleDays = stalled
      ? Math.floor((Date.now() - new Date(lastEvent.at).getTime()) / 86400000) : 0;

    return `<div class="order">
      <img class="cover" src="/media/samples/${escapeHtml((item.image || "").split("/").pop())}" alt="">
      <div class="grow">
        <div class="spread">
          <div>
            <div class="strong">${escapeHtml(item.title || "Item")}</div>
            <div class="small dim">${escapeHtml(item.variant || "")} · ${rupees(o.total)}
              · <span class="mono tiny">${escapeHtml(o.order_id)}</span></div>
          </div>
          ${o.delivered_at
            ? `<span class="badge badge-ok"><span class="dot"></span>Delivered ${timeAgo(o.delivered_at)}</span>`
            : `<span class="badge ${idleDays >= 7 ? "badge-warn" : "badge-none"}">
                 ${idleDays >= 7 ? `No movement for ${idleDays} days` : titleCase(o.status)}</span>`}
        </div>
        <div class="track">
          <div class="trail">
            ${(o.shipment_events || []).map((e) =>
              `<span class="pip ${e.status === "delivered" ? "done" :
                 (e.status === "undelivered" ? "stuck" : "")}" title="${escapeHtml(e.status)}"></span>`).join("")}
          </div>
          <span>${escapeHtml(o.courier || "")} ${escapeHtml(o.tracking_id || "")}</span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-secondary btn-sm" data-order="${escapeHtml(o.order_id)}"
                  data-store="${escapeHtml(o.store_id)}">Report an issue</button>
          <span class="tiny dim">${o.payment_method === "cod" ? "Cash on delivery" : "Prepaid"}</span>
        </div>
      </div>
    </div>`;
  }).join("");

  ordersEl.querySelectorAll("[data-order]").forEach((btn) => {
    btn.onclick = () => openWidget(btn.dataset.store, btn.dataset.order);
  });
}

/* The widget opens exactly as it would on a merchant's own site: an overlay
   iframe, so our styling and camera permissions are independent of the page. */
function openWidget(storeId, orderId) {
  const scrim = document.createElement("div");
  scrim.style.cssText = `position:fixed;inset:0;background:var(--scrim);z-index:50;
    display:flex;align-items:stretch;justify-content:flex-end;`;
  const frame = document.createElement("iframe");
  frame.src = `/widget.html?store=${encodeURIComponent(storeId)}&order=${encodeURIComponent(orderId)}`;
  frame.allow = "camera; microphone";
  frame.style.cssText = `width:min(460px,100vw);height:100%;border:none;background:var(--surface-1);
    box-shadow:var(--shadow-3);`;
  const close = document.createElement("button");
  close.className = "btn btn-secondary btn-sm";
  close.textContent = "Close";
  close.style.cssText = "position:absolute;top:14px;left:14px;";
  close.onclick = () => scrim.remove();
  scrim.append(close, frame);
  scrim.addEventListener("click", (e) => { if (e.target === scrim) scrim.remove(); });
  document.body.appendChild(scrim);
}
</script>
</body>
</html>
