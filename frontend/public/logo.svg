<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rezo">
  <!-- Two parties and the thing that joins them. The left node is the buyer,
       the right the seller, and the link between is the whole product: a claim
       that gets connected to a decision instead of sitting in a queue. -->
  <rect width="40" height="40" rx="10" fill="#111114"/>
  <circle cx="13.5" cy="20" r="4.2" fill="none" stroke="#fff" stroke-width="2.2"/>
  <circle cx="26.5" cy="20" r="4.2" fill="none" stroke="#fff" stroke-width="2.2"/>
  <path d="M17.7 20h4.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26.5" cy="20" r="1.9" fill="#818cf8"/>
</svg>
