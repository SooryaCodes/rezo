<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezo · Agent console</title>
<link rel="stylesheet" href="/styles/app.css">
<style>
  .console { display: grid; grid-template-columns: 1fr 400px; gap: var(--s5);
             padding: var(--s5); align-items: start; }
  .graph { display: flex; flex-direction: column; align-items: center; gap: 0;
           padding: var(--s6) var(--s4); }
  .node { width: 210px; border: 1px solid var(--border); background: var(--surface-1);
          border-radius: var(--r-md); padding: 9px 12px; text-align: center;
          transition: all var(--base) var(--ease); }
  .node .name { font-size: var(--t-base); font-weight: var(--fw-medium); }
  .node .role { font-size: var(--t-xs); color: var(--text-3); }
  .node .out { font-size: var(--t-xs); color: var(--text-3); margin-top: 3px;
               font-variant-numeric: tabular-nums; }
  .node.live { border-color: var(--accent); background: var(--accent-soft);
               box-shadow: 0 0 0 3px var(--accent-soft); }
  .node.live .name { color: var(--accent); }
  .node.done { border-color: var(--border-strong); }
  .node.done .out { color: var(--success); }
  .node.frozen { border-color: var(--warn); background: var(--warn-soft); }
  .node.frozen .name { color: var(--warn); }
  .node.blocked { border-color: var(--danger); background: var(--danger-soft); }
  .link { width: 1px; height: 18px; background: var(--border-strong); }
  .parallel { display: flex; gap: var(--s4); align-items: flex-start; }
  .parallel-note { font-size: var(--t-xs); color: var(--text-3); text-align: center;
                   padding: 4px 0; }

  .stream { border: 1px solid var(--border-subtle); border-radius: var(--r-lg);
            background: var(--surface-1); height: calc(100vh - 140px); display: flex;
            flex-direction: column; position: sticky; top: var(--s5); }
  .stream-body { overflow-y: auto; padding: var(--s3) var(--s4); flex: 1;
                 font-family: var(--font-mono); font-size: var(--t-sm); }
  .ev { padding: 4px 0; border-bottom: 1px solid var(--border-subtle); display: flex; gap: 8px; }
  .ev:last-child { border-bottom: none; }
  .ev .t { color: var(--text-4); flex: none; }
  .ev .a { color: var(--accent); flex: none; width: 84px; }
  .ev .m { color: var(--text-2); overflow-wrap: anywhere; }
  .ev.gate .m { color: var(--warn); }
  .ev.error .m { color: var(--danger); }
  .ev.decision .m { color: var(--text); font-weight: var(--fw-medium); }
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <a class="brand" href="/"><span class="brand-mark">R</span> Rezo</a>
    <span class="dim">/</span><span class="muted">Agent console</span>
  </div>
  <div class="row">
    <select class="select" id="casePicker" style="width:auto;min-width:280px"></select>
    <button class="btn btn-ghost btn-sm" data-theme-toggle>Dark</button>
    <a class="btn btn-secondary btn-sm" href="/dashboard.html">Dashboard</a>
  </div>
</div>

<div class="console">
  <div>
    <div class="panel">
      <div class="panel-head">
        <div><span class="strong" id="caseTitle">No case selected</span>
          <div class="tiny dim" id="caseSub"></div></div>
        <span class="badge badge-none" id="caseStatus">idle</span>
      </div>
      <div class="graph" id="graph"></div>
    </div>

    <div class="metrics" style="margin-top:var(--s4)">
      <div class="metric"><span class="metric-value" id="mElapsed">—</span>
        <span class="metric-label">Elapsed</span></div>
      <div class="metric"><span class="metric-value" id="mCalls">0</span>
        <span class="metric-label">Model calls</span></div>
      <div class="metric"><span class="metric-value" id="mCost">₹0</span>
        <span class="metric-label">Cost this case</span></div>
      <div class="metric"><span class="metric-value" id="mAudit">0</span>
        <span class="metric-label">Audit entries</span></div>
    </div>
  </div>

  <div class="stream">
    <div class="panel-head"><span class="strong">Event stream</span>
      <span class="badge badge-live" id="liveDot"><span class="dot"></span> live</span></div>
    <div class="stream-body" id="stream"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const NODES = [
  { id: "interaction", name: "Interaction", role: "understands the claim" },
  { id: "evidence", name: "Evidence", role: "verifies what was captured", parallel: true },
  { id: "policy", name: "Policy", role: "cites the governing clause", parallel: true },
  { id: "fraud", name: "Fraud", role: "scores the risk" },
  { id: "resolution", name: "Resolution", role: "decides the outcome" },
  { id: "guardrail", name: "Guardrail", role: "limits enforced in code" },
  { id: "escalation", name: "Escalation", role: "asks a human", branch: true },
  { id: "execution", name: "Execution", role: "moves money and goods", branch: true },
];

let caseId = null, stop = null, seen = {}, startedAt = null;

renderGraph();
(async function boot() {
  await refreshCases();
  setInterval(refreshCases, 8000);
})();

async function refreshCases() {
  const rows = await API.disputes();
  const picker = document.getElementById("casePicker");
  const keep = picker.value;
  picker.innerHTML = rows.map((r) =>
    `<option value="${r.dispute_id}">${r.dispute_id} · ${escapeHtml(r.buyer_name || "")} ·
      ${titleCase(r.claim_type)} ${rupees(r.claim_value)}</option>`).join("");
  if (!rows.length) return;
  picker.value = keep && rows.some((r) => r.dispute_id === keep) ? keep : rows[0].dispute_id;
  picker.onchange = () => select(picker.value);
  if (!caseId) select(picker.value);
}

function renderGraph() {
  const graph = document.getElementById("graph");
  const node = (n) => `<div class="node" data-node="${n.id}">
      <div class="name">${n.name}</div><div class="role">${n.role}</div>
      <div class="out"></div></div>`;
  graph.innerHTML = `
    ${node(NODES[0])}
    <div class="link"></div>
    <div class="parallel-note">run concurrently</div>
    <div class="parallel">${node(NODES[1])}${node(NODES[2])}</div>
    <div class="link"></div>
    ${node(NODES[3])}
    <div class="link"></div>
    ${node(NODES[4])}
    <div class="link"></div>
    ${node(NODES[5])}
    <div class="link"></div>
    <div class="parallel">${node(NODES[6])}${node(NODES[7])}</div>`;
}

async function select(id) {
  if (stop) stop();
  caseId = id; seen = {}; startedAt = null;
  document.getElementById("stream").innerHTML = "";
  document.querySelectorAll(".node").forEach((n) => {
    n.className = "node"; n.querySelector(".out").textContent = "";
  });

  const d = await API.dispute(id);
  document.getElementById("caseTitle").textContent =
    `${d.dispute_id} · ${titleCase(d.claim_type)} · ${rupees(d.claim_value)}`;
  document.getElementById("caseSub").textContent =
    `${d.store.name} · order ${d.order_id} · ${d.buyer.name}`;
  document.getElementById("caseStatus").outerHTML =
    statusBadge(d.status).replace("<span", '<span id="caseStatus"');
  document.getElementById("mAudit").textContent = d.audit.length;
  document.getElementById("mCalls").textContent = (d.usage || {}).calls || 0;
  document.getElementById("mCost").textContent =
    (d.usage || {}).cost_inr ? rupees((d.usage || {}).cost_inr) : "₹0";

  paint(d.events || []);
  stop = streamEvents(id, paint);
}

function paint(events) {
  const stream = document.getElementById("stream");
  for (const ev of events) {
    if (!startedAt) startedAt = new Date(ev.at);
    const row = document.createElement("div");
    row.className = "ev " + ev.kind;
    row.innerHTML = `<span class="t">${new Date(ev.at).toLocaleTimeString("en-GB")}</span>
      <span class="a">${escapeHtml(ev.agent)}</span>
      <span class="m">${escapeHtml(ev.message)}</span>`;
    stream.appendChild(row);

    const node = document.querySelector(`[data-node="${ev.agent}"]`);
    if (node) {
      if (ev.kind === "start") { node.className = "node live"; }
      else if (ev.kind === "error") { node.className = "node blocked"; }
      else if (ev.kind === "gate" && /waiting|Waiting|approval/.test(ev.message)) {
        node.className = "node frozen";
        node.querySelector(".out").textContent = "frozen — awaiting a human";
      } else {
        node.className = "node done";
        node.querySelector(".out").textContent = summarise(ev);
      }
    }
    if (ev.agent === "guardrail" && ev.data.route) {
      const g = document.querySelector('[data-node="guardrail"]');
      g.className = "node " + (ev.data.route === "auto" ? "done" : "frozen");
      g.querySelector(".out").textContent = ev.data.route === "auto"
        ? `autonomous · limit ${rupees(ev.data.effective_cap)}`
        : `human approval · over ${rupees(ev.data.effective_cap)}`;
    }
  }
  stream.scrollTop = stream.scrollHeight;
  if (startedAt) {
    const last = new Date(events[events.length - 1].at);
    const secs = Math.max(0, (last - startedAt) / 1000);
    document.getElementById("mElapsed").textContent = `${secs.toFixed(1)}s`;
  }
  refreshUsage();
}

function summarise(ev) {
  const d = ev.data || {};
  if (ev.agent === "evidence" && d.tier) return `${titleCase(d.tier)}`;
  if (ev.agent === "evidence" && "confidence" in d) return `confidence ${d.confidence}`;
  if (ev.agent === "policy" && d.eligible !== undefined)
    return `${d.eligible ? "eligible" : "not eligible"}${d.version ? " · " + d.version : ""}`;
  if (ev.agent === "fraud" && d.signals) return ev.message.toLowerCase();
  if (ev.agent === "resolution" && ev.kind === "decision") return ev.message;
  if (ev.agent === "execution" && d.steps) return d.steps[0] || "done";
  if (ev.agent === "interaction" && d.claim_type) return `${d.claim_type} · ${rupees(d.value || 0)}`;
  return "";
}

async function refreshUsage() {
  if (!caseId) return;
  try {
    const d = await API.dispute(caseId);
    document.getElementById("mCalls").textContent = (d.usage || {}).calls || 0;
    document.getElementById("mCost").textContent =
      (d.usage || {}).cost_inr ? "₹" + (d.usage || {}).cost_inr : "₹0";
    document.getElementById("mAudit").textContent = d.audit.length;
    const badge = document.getElementById("caseStatus");
    if (badge) badge.outerHTML = statusBadge(d.status).replace("<span", '<span id="caseStatus"');
  } catch (_) {}
}
</script>
</body>
</html>
